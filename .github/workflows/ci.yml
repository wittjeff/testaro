name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    name: Type check and syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Syntax-check all JavaScript
        run: |
          set -e
          find . -name '*.js' \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -not -path './dist/*' \
            -not -path './ed11y/*' \
            -print0 | xargs -0 -n1 node --check

  # The validation executors launch real browsers against fixture pages. This
  # job is advisory while flakiness and duration are being assessed; it becomes
  # a required check once it has proven stable (see issue #73).
  validation:
    name: Validation suite (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run validation executors
        run: npm run tests
